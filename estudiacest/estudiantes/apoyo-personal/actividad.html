<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Actividad guiada | Estudia CEST</title>
  <link rel="stylesheet" href="/estudiantes/apoyo-personal/actividad.css">
</head>
<body>
  <div class="loading" id="loading" role="status">Preparando tu actividad…</div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="back-link" href="/estudiantes/apoyo-personal/" aria-label="Volver a mi ruta">← <span>Mi ruta</span></a>
        <div class="identity">
          <strong>Estudia CEST</strong>
          <span id="studentLine"></span>
        </div>
        <button class="quiet-button" id="logout" type="button">Cerrar sesión</button>
      </div>
      <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
    </header>

    <main>
      <section class="intro-band">
        <div class="content intro-layout">
          <div>
            <div class="eyebrow" id="sessionLabel"></div>
            <h1 id="title"></h1>
            <p class="objective" id="objective"></p>
          </div>
          <div class="progress-copy"><b id="progressText">0 de 6</b><span>respuestas guardadas</span></div>
        </div>
      </section>

      <section class="steps-band" aria-labelledby="stepsTitle">
        <div class="content">
          <h2 id="stepsTitle">Tres pasos para responder</h2>
          <div class="steps" id="steps"></div>
        </div>
      </section>

      <section class="reading-band" aria-labelledby="stimulusTitle">
        <div class="content reading-layout">
          <article>
            <div class="section-head">
              <div>
                <div class="eyebrow" id="stimulusLabel"></div>
                <h2 id="stimulusTitle"></h2>
              </div>
              <button class="read-button" id="readStimulus" type="button">Escuchar texto</button>
            </div>
            <div class="stimulus" id="stimulus"></div>
            <div class="data-table-wrap" id="tableWrap" hidden></div>
          </article>
          <aside class="visual-support" id="visualSupport" aria-label="Apoyo visual"></aside>
        </div>
      </section>

      <section class="question-band" aria-labelledby="questionHeading">
        <div class="content">
          <div class="question-tool" id="questionTool">
            <div class="question-meta">
              <span id="questionNumber">Pregunta 1 de 6</span>
              <span class="skill" id="questionSkill"></span>
            </div>
            <div class="question-title-row">
              <h2 id="questionHeading"></h2>
              <button class="icon-button" id="readQuestion" type="button" title="Escuchar pregunta" aria-label="Escuchar pregunta">▶</button>
            </div>
            <p class="cue" id="questionCue"></p>
            <div class="options" id="options" role="radiogroup" aria-labelledby="questionHeading"></div>
            <div class="question-footer">
              <button class="secondary-button" id="previous" type="button">Anterior</button>
              <div class="save-state" id="saveState" role="status" aria-live="polite">Conectando…</div>
              <button class="primary-button" id="next" type="button">Siguiente</button>
              <button class="submit-button" id="submit" type="button" hidden>Entregar sesión</button>
            </div>
          </div>
          <p class="error-message" id="errorMessage" role="alert" hidden></p>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="deliveryConfirmation" role="dialog" aria-modal="true" aria-labelledby="deliveryTitle" hidden>
    <div class="modal-box">
      <div class="confirmation-mark" aria-hidden="true">✓</div>
      <h2 id="deliveryTitle">Entrega confirmada</h2>
      <p>Tu entrega quedó registrada correctamente.</p>
      <p class="result-copy" id="resultCopy"></p>
      <a class="primary-link" href="/estudiantes/apoyo-personal/">Volver a mi ruta</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="/estudiantes/js/forced-refresh.js"></script>
  <script src="/estudiantes/apoyo-personal/sesiones.js"></script>
  <script src="/estudiantes/apoyo-personal/actividad.js"></script>
</body>
</html>
