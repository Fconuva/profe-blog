<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Lecturas | Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .topbar {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: linear-gradient(135deg, #0f172a 0%, #115e59 55%, #164e63 100%);
      color: #f8fafc;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.20);
    }
    .idblock {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.12);
      font-size: 20px;
    }
    .avatar.logo {
      object-fit: contain;
      padding: 4px;
      border: 1px solid rgba(255,255,255,0.14);
    }
    .idblock h1 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 3px;
    }
    .idblock p {
      font-size: 12px;
      color: rgba(248,250,252,0.75);
    }
    .logout {
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.10);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 20px 44px;
    }
    .hero {
      padding: 24px 24px 22px;
      border-radius: 24px;
      background:
        radial-gradient(circle at top right, rgba(251, 191, 36, 0.18), transparent 24%),
        linear-gradient(135deg, #ffffff 0%, #f0fdfa 100%);
      border: 1px solid #d1fae5;
      margin-bottom: 18px;
    }
    .hero h2 {
      font-size: 30px;
      line-height: 1.05;
      font-weight: 800;
      margin-bottom: 10px;
      color: #0f172a;
    }
    .hero p {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.65;
      max-width: 760px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: #ffffff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      border-left: 4px solid #0f766e;
    }
    .stat .label {
      font-size: 11px;
      font-weight: 800;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .stat .value {
      font-size: 30px;
      font-weight: 800;
      color: #111827;
      margin-top: 5px;
    }
    .stat .sub {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .redirect-box {
      display: none;
      margin-bottom: 18px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.55;
    }
    .redirect-box.show { display: block; }
    .simce-card {
      display: none;
      margin-bottom: 18px;
      padding: 22px;
      border-radius: 22px;
      background:
        radial-gradient(circle at top right, rgba(251, 191, 36, 0.18), transparent 26%),
        linear-gradient(135deg, #fffbeb 0%, #ffffff 68%);
      border: 1px solid #fed7aa;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }
    .simce-card.show { display: block; }
    .simce-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }
    .simce-head h3 {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 6px;
    }
    .simce-head p {
      font-size: 13px;
      line-height: 1.65;
      color: #6b7280;
      max-width: 640px;
    }
    .simce-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 8px 12px;
      background: #ffedd5;
      color: #9a3412;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .simce-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .simce-metric {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.85);
      border: 1px solid #fde68a;
      display: grid;
      gap: 7px;
    }
    .simce-metric.primary {
      background: linear-gradient(135deg, #fff7ed 0%, #ffffff 100%);
      border-color: #fdba74;
    }
    .simce-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #6b7280;
    }
    .simce-metric strong {
      font-size: 30px;
      line-height: 1;
      font-weight: 800;
      color: #111827;
    }
    .simce-metric small {
      font-size: 12px;
      line-height: 1.55;
      color: #6b7280;
    }
    .simce-level {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .simce-level.adequado {
      background: #dcfce7;
      color: #166534;
    }
    .simce-level.elemental {
      background: #fef3c7;
      color: #92400e;
    }
    .simce-level.insuficiente {
      background: #fee2e2;
      color: #b91c1c;
    }
    .simce-note {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.78);
      border: 1px solid #fde68a;
      font-size: 13px;
      line-height: 1.7;
      color: #374151;
    }
    .simce-footnote {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #6b7280;
    }
    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
    }
    .list {
      display: grid;
      gap: 14px;
    }
    .empty {
      padding: 28px 24px;
      background: #ffffff;
      border-radius: 20px;
      color: #6b7280;
      line-height: 1.7;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      border: 1px solid #e5e7eb;
    }
    .card h3 {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 4px;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      background: #ecfdf5;
      color: #047857;
    }
    .chip.book { background: #fef3c7; color: #92400e; }
    .chip.done { background: #dcfce7; color: #166534; }
    .chip.progress { background: #dbeafe; color: #1d4ed8; }
    .card p {
      font-size: 13px;
      line-height: 1.65;
      color: #4b5563;
      max-width: 680px;
    }
    .card .cta {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      min-width: 176px;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #0f766e, #155e75);
      box-shadow: 0 12px 24px rgba(15, 118, 110, 0.18);
    }
    .card .cta.secondary {
      background: linear-gradient(135deg, #475569, #334155);
      box-shadow: none;
    }
    /* Orden visual 2026: resultado, acceso de clase y evaluaciones. */
    body { background: #f5f7fa; color: #172033; }
    .topbar { background: #14213d; }
    .page { max-width: 1180px; }
    .hero {
      padding: 22px 24px;
      border-radius: 8px;
      background: #ffffff;
      border-color: #dce3ec;
    }
    .hero h2 { font-size: 26px; }
    .simce-card {
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #cdd9e8;
      border-top: 5px solid #2457a6;
      box-shadow: 0 12px 28px rgba(20, 33, 61, 0.08);
    }
    .simce-chip { background: #e8f0fb; color: #174a8b; }
    .simce-metric {
      border-radius: 6px;
      background: #f8fafc;
      border-color: #dce3ec;
    }
    .simce-metric.primary { background: #eef5ff; border-color: #abc6ea; }
    .simce-note { border-radius: 6px; background: #f8fafc; border-color: #dce3ec; }
    .stat {
      border-radius: 6px;
      box-shadow: none;
      border: 1px solid #dce3ec;
      border-top: 3px solid #24746e;
    }
    .card, .empty { border-radius: 8px; }
    .card .cta { border-radius: 6px; }
    .section-block { margin-top: 24px; }
    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 12px;
    }
    .section-heading p { color: #6b7280; font-size: 12px; line-height: 1.5; }
    .guide-card { border-left: 5px solid #24746e; }
    .simce-actions { margin-top: 16px; display: flex; justify-content: flex-end; }
    .primary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #2457a6;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff !important;
      text-decoration: none;
    }
    @media (max-width: 720px) {
      .card { grid-template-columns: 1fr; }
      .card .cta { width: 100%; }
      .topbar { align-items: flex-start; }
      .simce-head, .section-heading { align-items: flex-start; flex-direction: column; }
      .simce-chip { white-space: normal; }
      .simce-actions .primary-link { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="idblock">
      <img class="avatar logo" src="/estudiantes/assets/insignia_talca_1.png" alt="Centro Educativo Salesianos Talca">
      <div>
        <h1 id="studentName">Cargando...</h1>
        <p id="studentMeta">Lecturas asignadas</p>
      </div>
    </div>
    <button class="logout" id="logoutBtn">Cerrar sesión</button>
  </header>

  <main class="page">
    <section class="hero">
      <h2 id="heroTitle">Panel SIMCE</h2>
      <p id="heroDescription">Taller de Comprensión Lectora 2026</p>
    </section>

    <div class="redirect-box" id="redirectBox"></div>
    <section class="simce-card" id="simceResultBox"></section>

    <div hidden aria-hidden="true">
      <section id="guideSection"><div id="guideList"></div></section>
      <h2 id="sessionsTitle"></h2>
      <div id="statsRow">
        <span id="statAssigned"></span>
        <span id="statDone"></span>
        <span id="statPending"></span>
      </div>
      <div id="sessionList"></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCuDQ_iHDHmTd8bPeqUbsXQqdxw2SObt8w",
      authDomain: "estudiacest.firebaseapp.com",
      databaseURL: "https://estudiacest-default-rtdb.firebaseio.com",
      projectId: "estudiacest",
      storageBucket: "estudiacest.firebasestorage.app",
      messagingSenderId: "999002169815",
      appId: "1:999002169815:web:51203237bc77c2e74deb92"
    };

    const STUDENT_BASE = 'plataforma_estudiantes';
    const LECTURAS_BASE = 'plataforma_lecturas';
    const GUIDE_ACTIVITIES = [
      {
        id: 'nm4-u2-semana11',
        title: 'NM4 · Materiales y guías',
        description: 'Entrada principal a las guías, al tríptico y a los recursos que se vayan publicando para NM4.',
        link: '/nm4/',
        courses: ['4A-TP', '4B-TP', '4C-TP', '4D-TP', '4E-TP']
      },
      {
        id: 'nm2-plataforma-estudiantes',
        title: 'NM2 · Plataforma de Estudiantes (Guías y Trabajos)',
        description: 'Ingresa aquí para acceder a tu panel interactivo, redactar tu bloque argumentativo Toulmin, y completar tus guías de trabajo de Segundo Medio.',
        link: '/estudiantes/dashboard.html',
        courses: ['2A-HC', '2B-HC']
      }
    ];
    const LEGACY_SIMCE_SESSION_IDS = {
      '2A-HC': 'ensayo-simce-miercoles-2a-hc-2026',
      '2B-HC': 'ensayo-simce-miercoles-2b-hc-2026'
    };
    const SIMCE_SCORE_ANCHORS = [
      { pct: 0, score: 150 },
      { pct: 21, score: 200 },
      { pct: 24, score: 200 },
      { pct: 36, score: 235 },
      { pct: 39, score: 235 },
      { pct: 48, score: 252 },
      { pct: 52, score: 252 },
      { pct: 58, score: 270 },
      { pct: 61, score: 270 },
      { pct: 67, score: 290 },
      { pct: 70, score: 290 },
      { pct: 73, score: 295 },
      { pct: 76, score: 295 },
      { pct: 82, score: 315 },
      { pct: 85, score: 315 },
      { pct: 91, score: 340 },
      { pct: 94, score: 340 },
      { pct: 100, score: 370 }
    ];

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const db = firebase.database();

    const listEl = document.getElementById('sessionList');
    const statsRow = document.getElementById('statsRow');
    const redirectBox = document.getElementById('redirectBox');
    const simceResultBox = document.getElementById('simceResultBox');
    const guideSection = document.getElementById('guideSection');
    const guideListEl = document.getElementById('guideList');
    const heroTitle = document.getElementById('heroTitle');
    const heroDescription = document.getElementById('heroDescription');
    const sessionsTitle = document.getElementById('sessionsTitle');

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await auth.signOut();
      window.location.href = '/lecturas/';
    });

    function normalizeContent(session) {
      const content = session.contenido || {};
      const items = content.items || content.preguntas || session.items || session.preguntas || [];
      const materials = content.materiales || content.textos || session.materiales || session.textos || [];
      return { items, materials };
    }

    function normalizeCourse(value) {
      return String(value || '').trim().toUpperCase();
    }

    function isNm2SimceCourse(curso) {
      return /^(2A|2B)-HC$/.test(normalizeCourse(curso));
    }

    function clampNumber(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function formatResultDate(timestamp) {
      const numericValue = Number(timestamp);
      if (!Number.isFinite(numericValue) || numericValue <= 0) return 'Sin fecha registrada';
      return new Date(numericValue).toLocaleDateString('es-CL', { day:'2-digit', month:'short', year:'numeric' });
    }

    function estimateSimceScore(porcentaje) {
      const pct = clampNumber(Number(porcentaje) || 0, 0, 100);
      let estimatedScore = SIMCE_SCORE_ANCHORS[SIMCE_SCORE_ANCHORS.length - 1].score;

      for (let index = 0; index < SIMCE_SCORE_ANCHORS.length - 1; index++) {
        const left = SIMCE_SCORE_ANCHORS[index];
        const right = SIMCE_SCORE_ANCHORS[index + 1];
        if (pct < left.pct || pct > right.pct) continue;

        const pctSpan = right.pct - left.pct;
        if (pctSpan <= 0) {
          estimatedScore = right.score;
          break;
        }

        const ratio = (pct - left.pct) / pctSpan;
        estimatedScore = left.score + ((right.score - left.score) * ratio);
        break;
      }

      const roundedScore = Math.round(estimatedScore);
      const levelKey = roundedScore >= 295 ? 'adequado' : roundedScore >= 252 ? 'elemental' : 'insuficiente';
      return {
        score: roundedScore,
        levelKey,
        levelLabel: levelKey === 'adequado' ? 'Adecuado' : levelKey === 'elemental' ? 'Elemental' : 'Insuficiente',
        gapToElemental: Math.max(0, 252 - roundedScore),
        gapToAdequado: Math.max(0, 295 - roundedScore)
      };
    }

    function getSimceProgressCopy(estimate) {
      if (estimate.levelKey === 'adequado') {
        return 'Ya estás sobre el corte Adecuado. La meta ahora es sostener este resultado y seguir afinando las preguntas de mayor dificultad.';
      }
      if (estimate.levelKey === 'elemental') {
        return estimate.gapToAdequado > 0
          ? 'Quedaste en nivel Elemental. Te faltan ' + estimate.gapToAdequado + ' puntos para entrar a Adecuado.'
          : 'Quedaste en nivel Elemental y ya estás muy cerca del tramo Adecuado.';
      }
      return estimate.gapToElemental > 0
        ? 'Hoy quedas bajo el corte Elemental. Te faltan ' + estimate.gapToElemental + ' puntos para llegar a ese umbral.'
        : 'Hoy quedas bajo el corte Elemental y conviene reforzar estrategias de lectura para cerrar la brecha.';
    }

    function hideSimceResult() {
      simceResultBox.classList.remove('show');
      simceResultBox.innerHTML = '';
    }

    function renderSimceResult(session, result) {
      if (!session) {
        hideSimceResult();
        return;
      }

      const sessionTitle = session.titulo || 'Ensayo SIMCE';
      if (!result) {
        simceResultBox.innerHTML = '<div class="simce-head">'
          + '<div><h3>Tu resultado SIMCE</h3><p>Cuando la corrección de tu ensayo quede publicada, aquí verás tu puntaje SIMCE estimado y tu nivel de aprendizaje.</p></div>'
          + '<div class="simce-chip">' + sessionTitle + '</div>'
          + '</div>'
          + '<div class="simce-note">Todavía no aparece un resultado cargado en esta cuenta para ese ensayo. Apenas esté publicado, se mostrará aquí con la conversión referencial a puntaje SIMCE.</div>'
          + '<div class="simce-actions">'
          + '<a href="/estudiantes/dashboard.html" class="primary-link">Ingresar a la Plataforma de Guías →</a>'
          + '</div>'
          + '<div class="simce-footnote">La estimación es pedagógica y no reemplaza un resultado oficial de SIMCE.</div>';
        simceResultBox.classList.add('show');
        return;
      }

      const porcentaje = clampNumber(Number(result.porcentaje) || 0, 0, 100);
      const estimate = estimateSimceScore(porcentaje);
      const sessionDate = formatResultDate(result.submitted_at);

      simceResultBox.innerHTML = '<div class="simce-head">'
        + '<div><h3>Tu resultado SIMCE</h3><p>Esta tarjeta convierte tu último ensayo diagnóstico en un puntaje SIMCE estimado usando la tabla docente de referencia.</p></div>'
        + '<div class="simce-chip">' + sessionTitle + '</div>'
        + '</div>'
        + '<div class="simce-grid">'
        + '<article class="simce-metric primary"><span class="simce-label">Puntaje SIMCE estimado</span><strong>' + estimate.score + ' pts</strong><small>Conversión referencial desde ' + Math.round(porcentaje) + '% de logro</small></article>'
        + '<article class="simce-metric"><span class="simce-label">Nivel de aprendizaje</span><div class="simce-level ' + estimate.levelKey + '">' + estimate.levelLabel + '</div><small>Cortes oficiales: Elemental 252 · Adecuado 295</small></article>'
        + '<article class="simce-metric"><span class="simce-label">Último registro</span><strong>' + sessionDate + '</strong><small>' + sessionTitle + '</small></article>'
        + '</div>'
        + '<div class="simce-note">' + getSimceProgressCopy(estimate) + '</div>'
        + '<div class="simce-actions">'
        + '<a href="/estudiantes/dashboard.html" class="primary-link">Ingresar a la Plataforma de Guías →</a>'
        + '</div>'
        + '<div class="simce-footnote">Estimación referencial basada en la tabla docente y los cortes oficiales 252 / 295. El SIMCE oficial utiliza modelos IRT, por eso este puntaje no reemplaza un resultado oficial.</div>';
      simceResultBox.classList.add('show');
    }

    async function loadSimceResult(uid, student) {
      hideSimceResult();
      if (!student || !isNm2SimceCourse(student.curso)) return;

      try {
        const course = normalizeCourse(student.curso);
        const sessionsSnap = await db.ref(STUDENT_BASE + '/sesiones').once('value');
        const candidates = [];
        sessionsSnap.forEach(child => {
          const session = { id: child.key, ...child.val() };
          const searchable = (session.id + ' ' + (session.titulo || '')).toLowerCase();
          const assigned = !Array.isArray(session.asignados) || !session.asignados.length
            || session.asignados.includes(course) || session.asignados.includes(uid);
          if (assigned && session.resultados_visibles === true && searchable.includes('simce')) {
            candidates.push(session);
          }
        });

        const legacyId = LEGACY_SIMCE_SESSION_IDS[course];
        if (legacyId && !candidates.some(session => session.id === legacyId)) {
          const legacySnap = await db.ref(STUDENT_BASE + '/sesiones/' + legacyId).once('value');
          if (legacySnap.exists()) candidates.push({ id: legacyId, ...legacySnap.val() });
        }

        const bundles = await Promise.all(candidates.map(async session => {
          const resultSnap = await db.ref(STUDENT_BASE + '/resultados/' + session.id + '/' + uid).once('value');
          return resultSnap.exists() ? { session, result: resultSnap.val() } : null;
        }));
        const available = bundles.filter(Boolean).sort((left, right) => {
          const leftDate = Number(left.result.submitted_at || left.result.timestamp || left.session.createdAt || 0);
          const rightDate = Number(right.result.submitted_at || right.result.timestamp || right.session.createdAt || 0);
          return rightDate - leftDate;
        });

        if (available.length) renderSimceResult(available[0].session, available[0].result);
        else hideSimceResult();
      } catch (error) {
        console.error('[lecturas/simce-result]', error);
      }
    }

    async function getStudent(uid) {
      const snap = await db.ref(STUDENT_BASE + '/estudiantes/' + uid).once('value');
      return snap.val();
    }

    async function getAssignedIds(uid) {
      const snap = await db.ref(LECTURAS_BASE + '/asignaciones/' + uid).once('value');
      return snap.exists() ? Object.keys(snap.val()) : [];
    }

    async function getSessionById(id) {
      const snap = await db.ref(LECTURAS_BASE + '/sesiones/' + id).once('value');
      return snap.exists() ? { id, ...snap.val() } : null;
    }

    async function getResponse(sessionId, uid) {
      const snap = await db.ref(LECTURAS_BASE + '/respuestas/' + sessionId + '/' + uid).once('value');
      return snap.val();
    }

    async function getGuideProgress(taskId, uid) {
      const snap = await db.ref(STUDENT_BASE + '/tareas/' + taskId + '/' + uid).once('value');
      return snap.val();
    }

    function isAccessOnlyStudent(student) {
      return !!(student && (student.access_only === true || student.access_only === 'true' || student.access_only === 1));
    }

    function renderAccessOnlyState(student) {
      const course = String(student && student.curso || '').trim();
      heroTitle.textContent = 'Acceso habilitado';
      heroDescription.textContent = 'Tu cuenta está activa. Por ahora este espacio solo confirma el ingreso y no muestra evaluaciones ni actividades publicadas.';
      sessionsTitle.textContent = 'Estado del acceso';
      statsRow.style.display = 'none';
      redirectBox.classList.remove('show');
      redirectBox.innerHTML = '';
      hideSimceResult();
      guideSection.style.display = 'none';
      guideListEl.innerHTML = '';
      document.getElementById('studentMeta').textContent = course ? (course + ' · Acceso habilitado') : 'Acceso habilitado';
      listEl.innerHTML = '<div class="empty">Tu ingreso está habilitado correctamente. Cuando el profesor publique contenido para tu cuenta, aparecerá aquí.</div>';
    }

    function updateStats(sessions) {
      const assigned = sessions.length;
      const done = sessions.filter(s => s.response && s.response.completada).length;
      const pending = sessions.filter(s => !s.response || !s.response.completada).length;
      document.getElementById('statAssigned').textContent = assigned;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statPending').textContent = pending;
    }

    function renderSessions(sessions) {
      if (!sessions.length) {
        listEl.innerHTML = '<div class="empty">No tienes pruebas asignadas por ahora. Cuando el profesor publique una evaluación en esta sección, aparecerá aquí.</div>';
        return;
      }

      listEl.innerHTML = sessions.map(session => {
        const content = normalizeContent(session);
        const itemCount = content.items.length;
        const materialCount = content.materials.length;
        const completed = session.response && session.response.completada;
        const inProgress = session.response && !session.response.completada;
        const locked = session.__locked;
        const lockReason = session.__lockReason || '';
        const chips = [
          session.libro ? '<span class="chip book">' + session.libro + '</span>' : '',
          materialCount ? '<span class="chip">' + materialCount + ' material(es)</span>' : '',
          itemCount ? '<span class="chip">' + itemCount + ' ítem(s)</span>' : '',
          completed ? '<span class="chip done">Completada</span>' : '',
          inProgress ? '<span class="chip progress">En progreso</span>' : '',
          locked ? '<span class="chip" style="background:#fee2e2;color:#b91c1c;border-color:#fecaca">🔒 Bloqueada</span>' : ''
        ].join('');
        const buttonLabel = locked ? '🔒 Bloqueada' : (completed ? 'Revisar prueba' : inProgress ? 'Continuar prueba' : 'Entrar a prueba');
        const buttonClass = locked ? 'cta secondary' : (completed ? 'cta secondary' : 'cta');
        const clickHandler = locked ? 'return false' : 'window.location.href=\'/lecturas/prueba?id=' + encodeURIComponent(session.id) + '\'';
        const disabledAttr = locked ? ' disabled style="opacity:.6;cursor:not-allowed"' : '';
        return '<article class="card">'
          + '<div>'
          + '<h3>' + (session.titulo || 'Prueba sin título') + '</h3>'
          + '<div class="meta">' + chips + '</div>'
          + '<p>' + (locked && lockReason ? lockReason : (session.descripcion || 'Sin descripción.')) + '</p>'
          + '</div>'
          + '<button class="' + buttonClass + '"' + disabledAttr + ' onclick="' + clickHandler + '">' + buttonLabel + '</button>'
          + '</article>';
      }).join('');
    }

    async function renderGuideActivities(student, uid) {
      const course = String(student && student.curso || '');
      const visible = GUIDE_ACTIVITIES.filter(activity => !activity.courses || activity.courses.includes(course));
      if (!visible.length) {
        guideSection.style.display = 'none';
        guideListEl.innerHTML = '';
        return;
      }

      const cards = [];
      for (const activity of visible) {
        const progress = await getGuideProgress(activity.id, uid);
        const completed = !!(progress && progress.completada);
        const inProgress = !!(progress && !progress.completada && progress.last_save);
        const chips = [
          '<span class="chip book">Trabajo de clase</span>',
          completed ? '<span class="chip done">Entregada</span>' : '',
          inProgress ? '<span class="chip progress">En progreso</span>' : (!completed ? '<span class="chip">Disponible</span>' : '')
        ].join('');
        const buttonLabel = completed ? 'Revisar guía' : inProgress ? 'Continuar guía' : 'Abrir guía';
        const buttonClass = completed ? 'cta secondary' : 'cta';
        cards.push('<article class="card guide-card">'
          + '<div>'
          + '<h3>' + activity.title + '</h3>'
          + '<div class="meta">' + chips + '</div>'
          + '<p>' + activity.description + '</p>'
          + '</div>'
          + '<button class="' + buttonClass + '" onclick="window.location.href=\'' + activity.link + '\'">' + buttonLabel + '</button>'
          + '</article>');
      }

      guideSection.style.display = '';
      guideListEl.innerHTML = cards.join('');
    }

    function maybeRedirect(sessions) {
      const open = sessions.filter(s => !s.__locked && (!s.response || !s.response.completada));
      if (open.length !== 1) return;
      redirectBox.classList.add('show');
      redirectBox.innerHTML = 'Solo tienes una prueba pendiente. Serás redirigido automáticamente en 3 segundos o puedes entrar de inmediato desde el botón.';
      setTimeout(() => {
        window.location.href = '/lecturas/prueba?id=' + encodeURIComponent(open[0].id);
      }, 3000);
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = '/lecturas/';
        return;
      }
      try {
        const student = await getStudent(user.uid);
        if (!student) {
          await auth.signOut();
          window.location.href = '/lecturas/';
          return;
        }
        document.getElementById('studentName').textContent = student.nombre || 'Estudiante';
        document.getElementById('studentMeta').textContent = (student.curso || 'Sin curso') + ' · Sección Lecturas';

        if (isAccessOnlyStudent(student)) {
          renderAccessOnlyState(student);
          return;
        }

        const ids = await getAssignedIds(user.uid);
        const TEST_RUT = '222222222';
        const isTestAccount = student && typeof student.rut === 'string' && student.rut.replace(/[^0-9kK]/g,'').toLowerCase() === TEST_RUT;
        const sessions = [];
        for (const id of ids) {
          const session = await getSessionById(id);
          if (!session) continue;
          // Saltar sesiones incompletas/huerfanas (sin titulo): aparecen como "Prueba sin titulo"
          if (!session.titulo || !String(session.titulo).trim()) continue;
          session.response = await getResponse(id, user.uid);
          // Bloqueo por activa:false o por disponibleDesde futuro
          let locked = false; let reason = '';
          if (session.activa === false) { locked = true; reason = 'Prueba aún no habilitada por el docente.'; }
          const content = session.contenido || {};
          const dd = session.disponibleDesde || content.disponibleDesde;
          if (!locked && dd) {
            const ts = Date.parse(dd);
            if (!isNaN(ts) && Date.now() < ts) {
              locked = true;
              reason = 'Disponible desde ' + new Date(ts).toLocaleString('es-CL') + '.';
            }
          }
          session.__locked = locked;
          session.__lockReason = reason;
          // Cuenta de prueba (22.222.222-2): bypass total para previsualizar
          if (isTestAccount) { session.__locked = false; session.__lockReason = ''; }
          sessions.push(session);
        }
        sessions.sort((a, b) => (a.orden || 0) - (b.orden || 0));
        updateStats(sessions);
        renderSessions(sessions);
        await loadSimceResult(user.uid, student);
        await renderGuideActivities(student, user.uid);
        // Auto-redirect deshabilitado: el estudiante siempre debe poder elegir entre sus pruebas
        // (incluyendo las bloqueadas, para ver fecha de habilitacion).
      } catch (error) {
        console.error('[lecturas/dashboard]', error);
        listEl.innerHTML = '<div class="empty">No se pudieron cargar tus pruebas. Recarga la página o intenta nuevamente más tarde.</div>';
      }
    });
  </script>
