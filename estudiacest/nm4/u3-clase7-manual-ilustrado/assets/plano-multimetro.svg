<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Plano de identificación de un multímetro Fluke 101</title>
<desc id="desc">Esquema simplificado sin escala con dos vistas. En el frente: uno pantalla, dos HOLD, tres botón amarillo, cuatro selector. En la base: cinco COM y seis terminal de entrada. No representa conexiones eléctricas.</desc>
<rect width="900" height="660" fill="white"/>
<g font-family="Arial,sans-serif" fill="#172b3a"><text x="38" y="44" font-size="24" font-weight="bold">FRENTE Y BASE · IDENTIFICACIÓN</text><text x="38" y="76" font-size="17">Dos vistas simplificadas, sin escala. No es un plano de instalación.</text></g>
<rect x="309" y="106" width="282" height="386" rx="40" fill="#f2ca4a" stroke="#172b3a" stroke-width="4"/>
<rect x="330" y="126" width="240" height="345" rx="24" fill="#39434b"/>
<rect x="355" y="157" width="190" height="105" rx="8" fill="#d6e4dc" stroke="#172b3a" stroke-width="3"/><text x="379" y="224" font-family="monospace" font-size="40" fill="#172b3a">0.000</text>
<rect x="355" y="278" width="61" height="28" rx="5" fill="#e2e8f0"/><text x="363" y="298" font-family="Arial" font-size="17">HOLD</text><circle cx="526" cy="293" r="16" fill="#f2ca4a"/>
<circle cx="450" cy="392" r="74" fill="#64717c" stroke="#172b3a" stroke-width="4"/><path d="M396 362 L502 420" stroke="#172b3a" stroke-width="20" stroke-linecap="round"/><text x="344" y="383" fill="white" font-family="Arial" font-size="16">OFF</text>
<text x="322" y="527" font-family="Arial" font-size="20" fill="#172b3a">Vista inferior: terminales</text><rect x="325" y="540" width="250" height="66" rx="16" fill="#39434b" stroke="#f2ca4a" stroke-width="5"/>
<circle cx="401" cy="570" r="15" fill="#101a24" stroke="#cfdbdf" stroke-width="2"/><circle cx="499" cy="570" r="15" fill="#101a24" stroke="#cfdbdf" stroke-width="2"/><text x="380" y="600" fill="white" font-family="Arial" font-size="15">COM</text>
<g fill="none" stroke="#0f766e" stroke-width="3"><path d="M450 186 L210 186"/><path d="M370 293 L210 293"/><path d="M526 293 L706 240"/><path d="M480 390 L706 390"/><path d="M401 570 L210 570"/><path d="M499 570 L706 570"/></g>
<g fill="#0f766e" stroke="white" stroke-width="3"><circle cx="185" cy="186" r="24"/><circle cx="185" cy="293" r="24"/><circle cx="730" cy="240" r="24"/><circle cx="730" cy="390" r="24"/><circle cx="185" cy="570" r="24"/><circle cx="730" cy="570" r="24"/></g>
<g fill="white" font-family="Arial" font-size="25" font-weight="bold" text-anchor="middle"><text x="185" y="195">1</text><text x="185" y="302">2</text><text x="730" y="249">3</text><text x="730" y="399">4</text><text x="185" y="579">5</text><text x="730" y="579">6</text></g>
<text x="38" y="640" font-size="15" font-family="Arial" fill="#526575">Estudia CEST · Basado en el manual y la fotografía del fabricante.</text>
</svg>
