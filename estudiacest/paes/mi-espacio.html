<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mi espacio PAES | Estudia CEST</title>
  <link rel="stylesheet" href="/estudiantes/css/mi-espacio.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1220; color: #e8edf5; }
    button, a { font: inherit; }
    a { color: #c7d2fe; }
    a:focus-visible, button:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
    .wrap { width: min(1120px, 100%); margin: 0 auto; padding: 24px 16px 60px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .top a { text-decoration: none; font-weight: 700; }
    .top span { font-size: 13px; color: #a5b4fc; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); }
    .intro { margin: 8px 0 22px; color: #aebdd0; line-height: 1.5; }
    .identity { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
    .identity[hidden], .message[hidden], .esp-caja[hidden] { display: none; }
    .identity-figure { width: 54px; height: 54px; display: grid; place-items: center; background: #1e293b; border-radius: 14px; overflow: hidden; }
    .identity strong { display: block; }
    .identity small { color: #aebdd0; }
    .message { padding: 18px; background: #1e293b; border: 1px solid #475569; border-radius: 12px; line-height: 1.5; }
    .message p { margin: 0 0 12px; }
    .message button { min-height: 44px; border: 0; border-radius: 8px; padding: 9px 16px; background: #a5b4fc; color: #111827; font-weight: 800; cursor: pointer; }
    .message button[hidden] { display: none; }
    .esp-caja { margin-top: 12px; }
    @media (max-width: 600px) { .wrap { padding: 16px 10px 36px; } .esp-cab { padding-top: 16px; } }
  </style>
  <script src="/paes/js/nominas.js" defer></script>
  <script src="/estudiantes/js/avatar-levels.js" defer></script>
  <script src="/estudiantes/js/personaje-iso.js" defer></script>
  <script src="/estudiantes/js/catalogo-casa.js" defer></script>
  <script src="/estudiantes/js/mapas-casa.js" defer></script>
  <script src="/estudiantes/js/mi-espacio.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js" defer></script>
  <script src="/paes/js/student-session.js" defer></script>
</head>
<body>
  <main class="wrap">
    <nav class="top" aria-label="Volver"><a href="/paes/">← Volver a PAES</a><span>Estudia CEST · PAES</span></nav>
    <h1>Mi espacio</h1>
    <p class="intro">Tu personaje, tu casa y tus muebles en un solo lugar.</p>
    <div class="identity" id="identity" hidden><div class="identity-figure" id="identityFigure" aria-hidden="true"></div><div><strong id="studentName"></strong><small id="studentCourse"></small></div></div>
    <div class="message" id="message" role="status"><p id="messageText">Comprobando tu cuenta…</p><button type="button" id="switchAccount" hidden>Cambiar cuenta de estudiante</button></div>
    <section class="esp-caja" id="spaceShell" aria-label="Mi avatar y mi casa" hidden><div class="esp-cab"><div><h2>Avatar y casa</h2><p>Los muebles se ganan con tareas o se reciben del profesor.</p></div></div><div id="miEspacio"></div></section>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';
      const LOGIN_URL = '/paes/?next=mi-espacio';
      const BASE = 'plataforma_estudiantes';
      const $ = id => document.getElementById(id);
      let mountedUid = '';

      function showMessage(text, allowSwitch) {
        $('messageText').textContent = text;
        $('switchAccount').hidden = !allowSwitch;
        $('message').hidden = false;
      }
      $('switchAccount').addEventListener('click', async () => {
        try { await PaesStudentSession.signOut(); window.location.replace(LOGIN_URL); }
        catch (_) { showMessage('No se pudo cerrar la sesión. Inténtalo nuevamente.', true); }
      });

      PaesStudentSession.client().then(({ auth, db }) => {
        auth.onAuthStateChanged(async user => {
          if (!user) { window.location.replace(LOGIN_URL); return; }
          if (mountedUid) { if (mountedUid !== user.uid) window.location.reload(); return; }
          try {
            const session = await PaesStudentSession.sessionFor(user);
            if (!session) {
              showMessage('Mi espacio está disponible solo para los cursos habilitados.', true); return;
            }
            PaesStudentSession.remember(session);
            const student = session.profile;
            const paesStudent = session.student;
            const avSnap = await db.ref(BASE + '/avatar/' + user.uid).once('value');
            const avatar = avSnap.val() || {};
            const xp = Number(avatar.xp_total) || 0;
            const look = AvatarLookSystem.normalizeLook(avatar.look, { xpTotal:xp, avatarData:avatar });
            $('studentName').textContent = student.nombre || 'Estudiante';
            $('studentCourse').textContent = paesStudent.curso;
            $('identity').hidden = false;
            AvatarLookSystem.render($('identityFigure'), { look, xpTotal:xp, avatarData:avatar, size:50, shape:'rounded' });
            $('spaceShell').hidden = false;
            $('message').hidden = true;
            MiEspacio.montar({
              host:$('miEspacio'), db, auth, base:BASE, uid:user.uid,
              nombre:student.nombre || 'Estudiante', curso:paesStudent.curso,
              xp, look, pieza:avatar.pieza, personajeEn:avatar.personajeEn,
              casa:avatar.casa, logros:avatar.logros, placas:avatar.placas, regalos:avatar.regalos,
              alCambiarLook(nuevo,regalos) {
                avatar.regalos=regalos || avatar.regalos;
                AvatarLookSystem.render($('identityFigure'), { look:nuevo, xpTotal:xp, avatarData:avatar, size:50, shape:'rounded' });
              }
            });
            mountedUid = user.uid;
          } catch (error) {
            console.error('[paes/mi-espacio]', error);
            showMessage('No se pudo cargar tu espacio. Recarga la página o inténtalo más tarde.', false);
          }
        });
      }).catch(() => showMessage('No se pudo recuperar la sesión. Recarga la página.', false));
    });
  </script>
</body>
</html>
