<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">Leer un relato: voz, tiempo e indicios</title><desc id="desc">Seis preguntas para aplicar los contenidos con evidencia textual.</desc><rect width="1000" height="1050" fill="#f7f4ec"/><path d="M40 100H960" stroke="#145d60" stroke-width="5"/><text x="40" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16383a">Leer un relato: voz, tiempo e indicios</text><rect x="40" y="135" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="135" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">1 · Voz</text><text x="58" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Participa en la historia?</text><text x="58" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Sí: protagonista o testigo.</text><text x="58" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">No: voz externa.</text><rect x="520" y="135" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="135" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">2 · Conocimiento</text><text x="538" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué puede saber?</text><text x="538" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Acciones observables o interioridad.</text><text x="538" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Comprueba el alcance en el texto.</text><rect x="40" y="420" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="420" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">3 · Personajes</text><text x="58" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué quieren y qué lo impide?</text><text x="58" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Rasgos, motivaciones y conflicto.</text><text x="58" y="611" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Distingue dato e inferencia.</text><rect x="520" y="420" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="420" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">4 · Tiempo</text><text x="538" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿En qué orden se cuenta?</text><text x="538" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Retroceso: analepsis.</text><text x="538" y="611" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Anticipación: prolepsis.</text><rect x="40" y="705" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="705" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">5 · Evidencia</text><text x="58" y="801" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué pista apoya tu lectura?</text><text x="58" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Relaciona palabras y acciones.</text><text x="58" y="896" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Revisa si aparece otra explicación.</text><rect x="520" y="705" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="705" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">6 · Efecto</text><text x="538" y="801" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué cambia para el lector?</text><text x="538" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">La voz limita o amplía lo que sabes.</text><text x="538" y="896" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Explica el efecto; no solo el nombre.</text><text x="40" y="1030" font-family="Arial,sans-serif" font-size="18" fill="#253d40">Estudia CEST · Contenidos de 1.º y 2.º medio · Síntesis y ejemplos originales</text></svg>