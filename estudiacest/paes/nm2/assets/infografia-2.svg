<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">Leer poesía: del recurso al sentido</title><desc id="desc">Seis preguntas para aplicar los contenidos con evidencia textual.</desc><rect width="1000" height="1050" fill="#f7f4ec"/><path d="M40 100H960" stroke="#145d60" stroke-width="5"/><text x="40" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16383a">Leer poesía: del recurso al sentido</text><rect x="40" y="135" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="135" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">1 · Voz</text><text x="58" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Quién expresa la experiencia?</text><text x="58" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Hablante distinto del poeta.</text><text x="58" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Actitud: enuncia, interpela o expresa su yo.</text><rect x="520" y="135" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="135" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">2 · Imágenes</text><text x="538" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué relación se construye?</text><text x="538" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Metáfora: identificación.</text><text x="538" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Comparación: semejanza con nexo.</text><rect x="40" y="420" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="420" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">3 · Contrastes</text><text x="58" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué ideas se enfrentan?</text><text x="58" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Antítesis: oposición de ideas.</text><text x="58" y="611" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Oxímoron: términos opuestos unidos.</text><rect x="520" y="420" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="420" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">4 · Repeticiones</text><text x="538" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué se reitera y dónde?</text><text x="538" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Anáfora: comienzo. Aliteración: sonidos.</text><text x="538" y="611" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Polisíndeton: nexos; asíndeton: omisión.</text><rect x="40" y="705" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="705" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">5 · Tradición</text><text x="58" y="801" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Con qué preocupación dialoga?</text><text x="58" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Carpe diem: aprovechar el presente.</text><text x="58" y="896" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Ubi sunt: preguntar por lo perdido.</text><rect x="520" y="705" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="705" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">6 · Interpretación</text><text x="538" y="801" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">Cita, relaciona y explica.</text><text x="538" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">El contexto determina el efecto.</text><text x="538" y="896" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Una figura no tiene una emoción fija.</text><text x="40" y="1030" font-family="Arial,sans-serif" font-size="18" fill="#253d40">Estudia CEST · Contenidos de 1.º y 2.º medio · Síntesis y ejemplos originales</text></svg>