<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">Evaluar una opinión: razones y límites</title><desc id="desc">Seis preguntas para aplicar los contenidos con evidencia textual.</desc><rect width="1000" height="1050" fill="#f7f4ec"/><path d="M40 100H960" stroke="#145d60" stroke-width="5"/><text x="40" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16383a">Evaluar una opinión: razones y límites</text><rect x="40" y="135" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="135" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">1 · Postura</text><text x="58" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué quiere sostener?</text><text x="58" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Reconoce la tesis.</text><text x="58" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Distingue el asunto de la posición.</text><rect x="520" y="135" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="135" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">2 · Fundamento</text><text x="538" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Por qué y con qué respaldo?</text><text x="538" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Generalización, causa, signos,</text><text x="538" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">autoridad o analogía.</text><rect x="40" y="420" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="420" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">3 · Calidad</text><text x="58" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿La razón sostiene la tesis?</text><text x="58" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Aceptabilidad: respaldo admisible.</text><text x="58" y="611" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Relevancia y suficiencia.</text><rect x="520" y="420" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="420" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">4 · Objeción</text><text x="538" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué dificultad plantea otra voz?</text><text x="538" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Comprende antes de responder.</text><text x="538" y="611" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Refuta razones; no ataques personas.</text><rect x="40" y="705" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="705" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">5 · Falacias</text><text x="58" y="801" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿La conclusión excede la evidencia?</text><text x="58" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">No generalices desde pocos casos.</text><text x="58" y="896" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Prestigio, amenaza o ataque no bastan.</text><rect x="520" y="705" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="705" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">6 · Revisión</text><text x="538" y="801" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué falta para decidir?</text><text x="538" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Acota alcance y pide datos pertinentes.</text><text x="538" y="896" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Cambiar una postura puede estar fundado.</text><text x="40" y="1030" font-family="Arial,sans-serif" font-size="18" fill="#253d40">Estudia CEST · Contenidos de 1.º y 2.º medio · Síntesis y ejemplos originales</text></svg>