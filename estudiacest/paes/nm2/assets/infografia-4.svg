<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">Escena y medios: construcción de una mirada</title><desc id="desc">Seis preguntas para aplicar los contenidos con evidencia textual.</desc><rect width="1000" height="1050" fill="#f7f4ec"/><path d="M40 100H960" stroke="#145d60" stroke-width="5"/><text x="40" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16383a">Escena y medios: construcción de una mirada</text><rect x="40" y="135" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="135" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">1 · Drama</text><text x="58" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué fuerzas se enfrentan?</text><text x="58" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Deseos, motivos y conflicto.</text><text x="58" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">El antagonista no siempre es un villano.</text><rect x="520" y="135" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="135" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">2 · Expresión</text><text x="538" y="231" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué se dice y qué se representa?</text><text x="538" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Diálogo, monólogo, aparte, acotación.</text><text x="538" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Luz, sonido y gestos crean sentido.</text><rect x="40" y="420" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="420" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">3 · Mensaje</text><text x="58" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Quién comunica y para qué?</text><text x="58" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Publicidad: finalidad comercial.</text><text x="58" y="611" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Propaganda: ideas o conductas.</text><rect x="520" y="420" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="420" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">4 · Selección</text><text x="538" y="516" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué destaca y qué omite?</text><text x="538" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Léxico, tamaño, imagen y encuadre.</text><text x="538" y="611" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Revisa contexto y condiciones.</text><rect x="40" y="705" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="40" y="705" width="450" height="52" rx="10" fill="#145d60"/><text x="58" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">5 · Fuentes</text><text x="58" y="801" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">¿Qué permite saber cada registro?</text><text x="58" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Fecha, autoría, método y pertinencia.</text><text x="58" y="896" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Un caso no representa por sí solo a todos.</text><rect x="520" y="705" width="450" height="248" rx="12" fill="white" stroke="#527a7a" stroke-width="2"/><rect x="520" y="705" width="450" height="52" rx="10" fill="#145d60"/><text x="538" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">6 · Conclusión</text><text x="538" y="801" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16383a">Ajusta lo afirmado a la evidencia.</text><text x="538" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Foto vacía no prueba desinterés.</text><text x="538" y="896" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#253d40">Propósito no equivale a resultado.</text><text x="40" y="1030" font-family="Arial,sans-serif" font-size="18" fill="#253d40">Estudia CEST · Contenidos de 1.º y 2.º medio · Síntesis y ejemplos originales</text></svg>