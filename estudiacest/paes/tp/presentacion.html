<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparación PAES TP · Clase</title><link rel="stylesheet" href="mini.css"><style>main{max-width:1100px}article{min-height:60vh;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(30px,4vw,64px)}article p{font-size:clamp(20px,2.4vw,34px);line-height:1.5}nav{display:flex;justify-content:space-between;gap:12px;align-items:center}button{min-height:48px}</style></head><body><main><p id="count"></p><article><h1 id="title"></h1><p id="body"></p></article><nav><button id="previous">Anterior</button><a id="practice" href="./">Ir a la práctica</a><button id="next">Siguiente</button></nav><p><a href="./">Volver a las tres semanas</a></p></main><script>const slides={"1": [{"title": "Activación", "body": "¿Cómo decides entre dos alternativas que parecen correctas? Comenten dos respuestas en voz alta, sin resolver preguntas del ensayo."}, {"title": "Normas", "body": "Trabajen solos en el equipo de la sala. No se permite el uso de celular. Mantengan abierta esta actividad y avisen si hay un problema de conexión. No compartan respuestas."}, {"title": "Objetivo", "body": "Reconocer el formato PAES y resolver preguntas de lectura para identificar el punto de partida."}, {"title": "Conocer el formato", "body": "La prueba oficial tiene siete lecturas, 65 preguntas A–D y 150 minutos. Hoy trabajarán una selección de tres lecturas y 20 preguntas durante 70 minutos. La nota corresponde solo a esta selección."}, {"title": "Responder el diagnóstico", "body": "Ingresen con su RUT y contraseña. Lean el texto junto a sus preguntas. Pueden volver a una respuesta antes de entregar. No se descuentan puntos por error."}, {"title": "Revisión y cierre", "body": "Después de entregar, revisen dos errores. En el cuaderno escriban qué les costó y qué harán distinto. Un resultado inicial sirve para elegir qué practicar."}], "2": [{"title": "Activación", "body": "¿Cómo decides entre dos alternativas que parecen correctas? Comenten dos respuestas en voz alta, sin resolver preguntas del ensayo."}, {"title": "Normas", "body": "Trabajen solos en el equipo de la sala. No se permite el uso de celular. Mantengan abierta esta actividad y avisen si hay un problema de conexión. No compartan respuestas."}, {"title": "Objetivo", "body": "Interpretar y evaluar textos usando evidencia y descarte razonado de alternativas."}, {"title": "Tres formas de leer", "body": "Localizar: encontrar información expresada en el texto, aunque la pregunta use otras palabras. Interpretar: relacionar pistas para comprender una idea no dicha directamente. Evaluar: juzgar una afirmación con criterios y evidencia."}, {"title": "Estrategia 1 · Pregunta, pista y respuesta", "body": "Lean qué pide la pregunta. Busquen el pasaje pertinente. Digan con sus palabras una respuesta breve antes de elegir la alternativa. La evidencia es el dato o pasaje que respalda esa respuesta; no basta con que una opción suene razonable."}, {"title": "Estrategia 2 · Descartar con una razón", "body": "Comparen cada alternativa con el texto. Descarten si contradice una pista, cambia quién hace algo, transforma una posibilidad en certeza o agrega información que el texto no permite afirmar. Una inferencia necesita pistas; una invención agrega datos sin respaldo."}, {"title": "ATENCIÓN · Ejemplo modelado", "body": "Texto de práctica: «El taller abrió los sábados durante un mes. El registro mostró más visitas, pero no identificó sus motivos». Pregunta: ¿puede concluirse que el nuevo horario causó el aumento? No. El registro muestra una coincidencia y no descarta otras causas. La palabra “causó” afirma más de lo que se sabe."}, {"title": "Comprobar antes de practicar", "body": "Solos, en el cuaderno y en dos minutos: escriban una afirmación que el ejemplo sí permite sostener y otra que no. Comparen con un compañero durante un minuto. Una respuesta posible: hubo más visitas; no se sabe por qué aumentaron."}, {"title": "Practicar · Tres textos y 18 preguntas", "body": "Solos, en la plataforma, resuelvan los tres textos en 50 minutos. Lean cada texto junto a sus seis preguntas. En el cuaderno anoten la pista que usaron en dos decisiones. Al entregar revisen la retroalimentación."}, {"title": "Revisión y cierre", "body": "En el cuaderno, corrijan dos decisiones: respuesta elegida, pista que faltó y razón para cambiarla o mantenerla. Terminen con una estrategia concreta para el próximo ensayo."}], "3": [{"title": "Activación", "body": "¿Cómo decides entre dos alternativas que parecen correctas? Comenten dos respuestas en voz alta, sin resolver preguntas del ensayo."}, {"title": "Normas", "body": "Trabajen solos en el equipo de la sala. No se permite el uso de celular. Mantengan abierta esta actividad y avisen si hay un problema de conexión. No compartan respuestas."}, {"title": "Objetivo", "body": "Aplicar estrategias de lectura para resolver un miniensayo y reconocer qué mejorar."}, {"title": "Recordar las estrategias", "body": "Lean qué pide la pregunta, busquen una pista y comparen las alternativas. Si una opción agrega datos, cambia la causa o exagera el alcance, revisen antes de elegir."}, {"title": "Resolver el miniensayo", "body": "Solos, en la plataforma: tres textos nuevos, seis preguntas por texto, 70 minutos. El orden es personal; las preguntas permanecen con su lectura. Al entregar recibirán su resultado y la revisión."}, {"title": "Revisión y cierre", "body": "Comparen sus porcentajes y revisen dos decisiones. Los instrumentos son distintos: una diferencia no prueba por sí sola una mejora. Expliquen qué estrategia aplicaron mejor y qué necesitan seguir practicando."}]};const lesson=new URLSearchParams(location.search).get('sesion')||'2',items=slides[lesson]||slides['2'];let index=0;function paint(){document.getElementById('title').textContent=items[index].title;document.getElementById('body').textContent=items[index].body;document.getElementById('count').textContent=(index+1)+' de '+items.length;document.getElementById('previous').disabled=index===0;document.getElementById('next').disabled=index===items.length-1;}document.getElementById('previous').onclick=()=>{index--;paint();};document.getElementById('next').onclick=()=>{index++;paint();};document.getElementById('practice').href='actividad.html?sesion='+lesson;paint();</script><script src="/assets/anotar-pizarra.js" defer></script></body></html>
