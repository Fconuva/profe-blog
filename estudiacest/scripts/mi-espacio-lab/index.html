<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Laboratorio local · Casa en L</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e8edf5;font:15px system-ui,sans-serif}
    main{max-width:1220px;margin:auto;padding:16px}h1{font-size:clamp(20px,3vw,30px);margin:0 0 6px}
    p{margin:0 0 12px;color:#a9bbce;line-height:1.45}.fila{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
    button{min-height:42px;border:1px solid #52647c;border-radius:10px;background:#1d3149;color:white;padding:7px 12px;font:inherit;cursor:pointer}
    button:hover,button:focus-visible,button.on{border-color:#4fd2fa;outline:2px solid #4fd2fa;outline-offset:1px}
    #lienzo{display:block;width:100%;height:min(72vh,660px);border:1px solid #33465d;border-radius:14px;
      background:radial-gradient(100% 100% at 50% 30%,#20354f,#101a2a);touch-action:none;cursor:pointer}
    #lienzo.arrastre{cursor:grab}#lienzo.arrastre:active{cursor:grabbing}
    #estado{min-height:22px;color:#b9e5fa;font-weight:700;margin-top:9px}small{color:#8da4b9}
    @media(max-width:600px){main{padding:9px}#lienzo{height:min(60vh,460px)}.fila{gap:5px}button{font-size:13px}}
  </style>
</head>
<body>
<main>
  <h1>Prueba de habitación en L</h1>
  <p>Mapa isométrico en JSON compatible con Tiled. Toca el piso para caminar entre las dos zonas; los huecos y los muebles cortan el paso.</p>
  <div class="fila" aria-label="Controles de la vista">
    <button id="alejar" type="button">− Alejar</button><span id="nivel">Vista completa</span>
    <button id="acercar" type="button">+ Acercar</button>
    <button id="arrastrar" type="button" aria-pressed="false">Mover vista</button>
    <button id="centrar" type="button">Centrar</button>
  </div>
  <canvas id="lienzo" tabindex="0" aria-label="Habitación en L de siete por siete casillas"></canvas>
  <div id="estado" role="status">Cargando mapa…</div>
  <small>Experimento local: no usa cuentas, no guarda datos y no sustituye la casa de los estudiantes.</small>
</main>
<script src="./mapa-tiled.js"></script>
<script src="../../estudiantes/js/personaje-iso.js"></script>
<script src="./demo.js"></script>
</body>
</html>
